version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: appforge-postgres
    environment:
      POSTGRES_USER: appforge
      POSTGRES_PASSWORD: appforge
      POSTGRES_DB: appforge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appforge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
